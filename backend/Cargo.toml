[package]
name = "desktop_email_client_backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "desktop_email_client"
path = "src/main.rs"

[dependencies]
desktop_email_client_shared = { path = "../shared", features = ["backend"] }
tauri = { version = "2.9.5", features = ["tracing"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fuzzy-matcher = "0.3.7"
uuid = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
