[package]
name = "desktop_email_client_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
desktop_email_client_shared = { path = "../shared" }
tokio = { version = "1.49.0", features = ["macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
fuzzy-matcher = "0.3.7"
chrono = { workspace = true }
actix-web = "4"
actix-cors = "0.7.1"
actix-files = "0.6.10"
actix-web-lab = "0.25.0"
async-trait = { workspace = true }
async-stream = "0.3.6"
sqlx = { version = "0.8.6", features = [
	"macros",
	"sqlite",
	"runtime-tokio",
	"migrate",
	"chrono"
] }
dotenvy = "0.15.7"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5.0", default-features = false, features = ["runtime-tokio"] }
thiserror = { workspace = true }
futures-util = { workspace = true }
keyring = { version = "3.6.3", features = ["sync-secret-service"] }
serde = { workspace = true }
serde_json = { workspace = true }

