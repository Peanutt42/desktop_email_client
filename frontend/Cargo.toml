[package]
name = "desktop_email_client_frontend"
version = "0.1.0"
edition = "2024"

[build-dependencies]
ureq = "3.2.0"

[dependencies]
desktop_email_client_shared = { path = "../shared" }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-web = { workspace = true }
yew = { version = "0.22", features = ["csr"] }
yew-autoprops = "0.4.1"
web-sys = { version = "0.3.84", features = [
	"DomRect",
	"CssStyleDeclaration",
	"HtmlDialogElement",
	"Document",
	"Element",
] }
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", branch = "v2", features = ["event"] }
gloo = "0.11.0"
gloo-net = { version = "0.6.0", optional = true }
yew-hooks = "0.4.0"
wasm-bindgen-futures = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
non_ipc_backend = ["gloo-net"]
