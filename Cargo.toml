[package]
name = "desktop_email_client"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { workspace = true }
yew-router = { workspace = true }
chrono = { workspace = true }
fuzzy-matcher = "0.3.7"

[workspace]
members = ["frontend", "backend"]

[workspace.dependencies]
uuid = { version = "1.19.0", features = ["v4", "js"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-web = "0.1.3"
yew-router = "0.19.0"
chrono = { version = "0.4.4", features = ["wasmbind"] }
